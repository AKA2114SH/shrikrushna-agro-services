<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Orbs -->
  <circle cx="200" cy="200" r="140" fill="#7dd3fc" opacity="0.18" filter="url(#glow)" />
  <circle cx="80" cy="80" r="80" fill="#0284c7" opacity="0.12" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
  </g>

  <!-- Top Floating Brand Pill -->
  <g filter="drop-shadow(0 4px 8px rgba(0,0,0,0.3))">
    <rect x="30" y="25" width="140" height="30" rx="15" fill="#0f172a" opacity="0.9" stroke="#7dd3fc" stroke-width="1.5" />
    <circle cx="45" cy="40" r="5" fill="#7dd3fc" />
    <text x="58" y="44" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff">Bayer CropScience</text>
  </g>

  <!-- Top Right 100% Genuine Seal -->
  <g filter="drop-shadow(0 4px 8px rgba(0,0,0,0.3))">
    <rect x="250" y="25" width="120" height="30" rx="15" fill="#0284c7" />
    <text x="310" y="44" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">१००% अस्सल निविष्ठा</text>
  </g>

  <!-- Main Illustration -->
  
      <!-- Bottle Body -->
      <path d="M165,130 L235,130 L235,160 L260,200 L260,330 C260,345 250,355 235,355 L165,355 C150,355 140,345 140,330 L140,200 L165,160 Z" fill="url(#botGrad)" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.4))" />
      <!-- Bottle Cap -->
      <rect x="175" y="95" width="50" height="35" rx="6" fill="#7dd3fc" stroke="#ffffff" stroke-width="2" />
      <!-- Label -->
      <rect x="150" y="210" width="100" height="110" rx="8" fill="#ffffff" />
      <rect x="155" y="215" width="90" height="25" rx="4" fill="#0284c7" />
      <text x="200" y="232" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">BAYER CROPSCIENCE</text>
      <text x="200" y="260" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle">Confidor</text>
      <text x="200" y="280" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#64748b" text-anchor="middle">Imidacloprid 17.8% SL</text>
      <rect x="160" y="298" width="80" height="16" rx="4" fill="#f1f5f9" />
      <text x="200" y="310" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#0284c7" text-anchor="middle">100 ml Bottle</text>
    

  <!-- Bottom Brand Footer Ribbon -->
  <rect x="0" y="360" width="400" height="40" fill="#020617" opacity="0.85" />
  <text x="20" y="384" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff">श्री कृष्ण ॲग्रो सर्व्हिसेस, सिन्नर</text>
  <text x="380" y="384" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#7dd3fc" text-anchor="end">100 ml Bottle</text>
</svg>