<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#155e75" />
      <stop offset="100%" stop-color="#164e63" />
    </linearGradient>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Orbs -->
  <circle cx="200" cy="200" r="140" fill="#a5f3fc" opacity="0.18" filter="url(#glow)" />
  <circle cx="80" cy="80" r="80" fill="#0891b2" opacity="0.12" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
  </g>

  <!-- Top Floating Brand Pill -->
  <g filter="drop-shadow(0 4px 8px rgba(0,0,0,0.3))">
    <rect x="30" y="25" width="140" height="30" rx="15" fill="#0f172a" opacity="0.9" stroke="#a5f3fc" stroke-width="1.5" />
    <circle cx="45" cy="40" r="5" fill="#a5f3fc" />
    <text x="58" y="44" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff">Multiplex</text>
  </g>

  <!-- Top Right 100% Genuine Seal -->
  <g filter="drop-shadow(0 4px 8px rgba(0,0,0,0.3))">
    <rect x="250" y="25" width="120" height="30" rx="15" fill="#0891b2" />
    <text x="310" y="44" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">१००% अस्सल निविष्ठा</text>
  </g>

  <!-- Main Illustration -->
  
      <!-- 3D Box Body -->
      <polygon points="150,130 250,130 280,165 280,345 180,345 150,310" fill="url(#botGrad)" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.4))" />
      <polygon points="150,130 180,165 180,345 150,310" fill="#000000" opacity="0.2" />
      <polygon points="150,130 250,130 280,165 180,165" fill="#a5f3fc" opacity="0.9" />
      <!-- Box Front Panel -->
      <rect x="175" y="165" width="105" height="175" fill="#ffffff" />
      <rect x="180" y="170" width="95" height="28" rx="4" fill="#0891b2" />
      <text x="227" y="188" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">MULTIPLEX</text>
      <text x="227" y="220" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle">Boron</text>
      <text x="227" y="240" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#64748b" text-anchor="middle">Disodium Octaborate</text>
      <rect x="185" y="295" width="85" height="22" rx="4" fill="#0891b2" />
      <text x="227" y="310" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">500 g Pack</text>
    

  <!-- Bottom Brand Footer Ribbon -->
  <rect x="0" y="360" width="400" height="40" fill="#020617" opacity="0.85" />
  <text x="20" y="384" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff">श्री कृष्ण ॲग्रो सर्व्हिसेस, सिन्नर</text>
  <text x="380" y="384" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#a5f3fc" text-anchor="end">500 g Pack</text>
</svg>