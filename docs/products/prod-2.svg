<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="100%" stop-color="#500724" />
    </linearGradient>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Orbs -->
  <circle cx="200" cy="200" r="140" fill="#f472b6" opacity="0.18" filter="url(#glow)" />
  <circle cx="80" cy="80" r="80" fill="#ec4899" opacity="0.12" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
  </g>

  <!-- Top Floating Brand Pill -->
  <g filter="drop-shadow(0 4px 8px rgba(0,0,0,0.3))">
    <rect x="30" y="25" width="140" height="30" rx="15" fill="#0f172a" opacity="0.9" stroke="#f472b6" stroke-width="1.5" />
    <circle cx="45" cy="40" r="5" fill="#f472b6" />
    <text x="58" y="44" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff">Mahadhan</text>
  </g>

  <!-- Top Right 100% Genuine Seal -->
  <g filter="drop-shadow(0 4px 8px rgba(0,0,0,0.3))">
    <rect x="250" y="25" width="120" height="30" rx="15" fill="#ec4899" />
    <text x="310" y="44" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">१००% अस्सल निविष्ठा</text>
  </g>

  <!-- Main Illustration -->
  
      <!-- Pouch / Sack Bag -->
      <path d="M140,110 L260,110 L275,340 C275,355 260,365 240,365 L160,365 C140,365 125,355 125,340 Z" fill="url(#botGrad)" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.4))" />
      <!-- Stitch Top -->
      <rect x="135" y="105" width="130" height="12" rx="3" fill="#f472b6" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,2" />
      <!-- Center Shield Badge -->
      <rect x="145" y="145" width="110" height="175" rx="12" fill="#ffffff" />
      <rect x="150" y="150" width="100" height="32" rx="6" fill="#ec4899" />
      <text x="200" y="170" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">MAHADHAN</text>
      <text x="200" y="205" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#0f172a" text-anchor="middle">0:52:34</text>
      <text x="200" y="225" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#64748b" text-anchor="middle">MKP 00:52:34</text>
      
      <!-- Leaf Icon Circle -->
      <circle cx="200" cy="260" r="18" fill="#ec4899" opacity="0.15" />
      <path d="M194,264 C194,256 200,250 206,252 C206,260 200,266 194,264 Z" fill="#ec4899" />
      
      <rect x="155" y="290" width="90" height="22" rx="6" fill="#ec4899" />
      <text x="200" y="305" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">1 Kg Bag</text>
    

  <!-- Bottom Brand Footer Ribbon -->
  <rect x="0" y="360" width="400" height="40" fill="#020617" opacity="0.85" />
  <text x="20" y="384" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff">श्री कृष्ण ॲग्रो सर्व्हिसेस, सिन्नर</text>
  <text x="380" y="384" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f472b6" text-anchor="end">1 Kg Bag</text>
</svg>